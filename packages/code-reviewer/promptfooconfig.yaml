description: AI Concept Compass — stały baseline code review

prompts:
  - "{{caseId}}"

providers:
  - id: file://dist/src/evals/promptfoo-provider.js
    label: code-reviewer-contract

tests:
  - description: clean diff passes
    vars:
      caseId: clean
    assert:
      - type: is-json
      - type: javascript
        value: JSON.parse(output).verdict === "pass" && JSON.parse(output).findings.length === 0 && Object.keys(JSON.parse(output).scores).length === 6 && ["correctness", "idiomaticity", "complexity", "test-risk-coverage", "documentation", "security-safety"].every((dimension) => Number.isInteger(JSON.parse(output).scores[dimension]) && JSON.parse(output).scores[dimension] >= 1 && JSON.parse(output).scores[dimension] <= 10)

  - description: missing risk test fails
    vars:
      caseId: missing-tests
    assert:
      - type: is-json
      - type: javascript
        value: JSON.parse(output).verdict === "fail" && JSON.parse(output).findings.some((f) => f.dimension === "test-risk-coverage") && Object.keys(JSON.parse(output).scores).length === 6 && ["correctness", "idiomaticity", "complexity", "test-risk-coverage", "documentation", "security-safety"].every((dimension) => Number.isInteger(JSON.parse(output).scores[dimension]) && JSON.parse(output).scores[dimension] >= 1 && JSON.parse(output).scores[dimension] <= 10)

  - description: security gap fails
    vars:
      caseId: security-gap
    assert:
      - type: is-json
      - type: javascript
        value: JSON.parse(output).verdict === "fail" && JSON.parse(output).findings.some((f) => f.dimension === "security-safety") && Object.keys(JSON.parse(output).scores).length === 6 && ["correctness", "idiomaticity", "complexity", "test-risk-coverage", "documentation", "security-safety"].every((dimension) => Number.isInteger(JSON.parse(output).scores[dimension]) && JSON.parse(output).scores[dimension] >= 1 && JSON.parse(output).scores[dimension] <= 10)

  - description: excessive complexity fails
    vars:
      caseId: excessive-complexity
    assert:
      - type: is-json
      - type: javascript
        value: JSON.parse(output).verdict === "fail" && JSON.parse(output).findings.some((f) => f.dimension === "complexity") && Object.keys(JSON.parse(output).scores).length === 6 && ["correctness", "idiomaticity", "complexity", "test-risk-coverage", "documentation", "security-safety"].every((dimension) => Number.isInteger(JSON.parse(output).scores[dimension]) && JSON.parse(output).scores[dimension] >= 1 && JSON.parse(output).scores[dimension] <= 10)

  - description: missing public-contract documentation fails
    vars:
      caseId: missing-documentation
    assert:
      - type: is-json
      - type: javascript
        value: JSON.parse(output).verdict === "fail" && JSON.parse(output).findings.some((f) => f.dimension === "documentation") && Object.keys(JSON.parse(output).scores).length === 6 && ["correctness", "idiomaticity", "complexity", "test-risk-coverage", "documentation", "security-safety"].every((dimension) => Number.isInteger(JSON.parse(output).scores[dimension]) && JSON.parse(output).scores[dimension] >= 1 && JSON.parse(output).scores[dimension] <= 10)

  - description: malformed input is rejected before a model call
    vars:
      caseId: malformed-input
    assert:
      - type: is-json
      - type: javascript
        value: JSON.parse(output).error.code === "INVALID_INPUT"
