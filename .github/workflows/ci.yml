name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # workflow:check verifies the planning-before-scaffold Git history.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix packages/code-reviewer
      # promptfoo needs better-sqlite3, a native addon whose binary is produced by its
      # install script. Rebuild exactly that one package rather than re-enabling
      # lifecycle scripts for the whole tree. Linux needs this; macOS resolves a
      # prebuilt, which is why a local run alone does not prove this step is unnecessary.
      - run: npm rebuild better-sqlite3 --prefix packages/code-reviewer
      - run: npm run workflow:check
      - run: npm run astro -- sync
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm --prefix packages/code-reviewer run typecheck
      - run: npm --prefix packages/code-reviewer test
      - run: npm --prefix packages/code-reviewer run eval:promptfoo
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    # The critical-flow spec creates and deletes rows for one shared hosted account,
    # which is why playwright.config.ts pins workers: 1. That only serialises within a
    # run; two pull requests running e2e at the same time still collide, and one
    # observed failure was exactly that. Serialise across refs too. A queued run waits
    # rather than being cancelled mid-cleanup.
    concurrency:
      group: hosted-e2e-account
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify required E2E configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "$E2E_USER_EMAIL"
          test -n "$E2E_USER_PASSWORD"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rls:
    runs-on: ubuntu-latest
    needs: quality
    # Same reasoning as e2e, against the two dedicated RLS accounts. A separate group,
    # so rls and e2e still run in parallel with each other within a run.
    concurrency:
      group: hosted-rls-accounts
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      RLS_USER_A_EMAIL: ${{ secrets.RLS_USER_A_EMAIL }}
      RLS_USER_A_PASSWORD: ${{ secrets.RLS_USER_A_PASSWORD }}
      RLS_USER_B_EMAIL: ${{ secrets.RLS_USER_B_EMAIL }}
      RLS_USER_B_PASSWORD: ${{ secrets.RLS_USER_B_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:rls
