name: AI Code Review
description: Runs the schema-validated OpenRouter reviewer on a PR diff.

inputs:
  pr-title:
    description: Pull Request title
    required: true
  pr-body:
    description: Pull Request body
    required: false
    default: ""
  base-sha:
    description: Trusted PR base commit
    required: true
  head-sha:
    description: PR head commit reviewed as data only
    required: true
  openrouter-api-key:
    description: OpenRouter API key supplied only from a GitHub Actions secret
    required: true
  model:
    description: OpenRouter model identifier
    required: false
    default: openai/gpt-4o-mini

outputs:
  exit-code:
    description: "0 pass, 1 review fail, 2 infrastructure/schema error"
    value: ${{ steps.review.outputs.exit-code }}
  verdict:
    description: pass, fail, or error
    value: ${{ steps.review.outputs.verdict }}
  result-path:
    description: Path to the validated JSON result
    value: ${{ steps.review.outputs.result-path }}
  comment-path:
    description: Path to the sticky PR comment body
    value: ${{ steps.review.outputs.comment-path }}

runs:
  using: composite
  steps:
    - name: Install trusted reviewer dependencies
      shell: bash
      working-directory: packages/code-reviewer
      run: npm ci --omit=dev --ignore-scripts

    - name: Build PR diff from merge base
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -euo pipefail
        git cat-file -e "${BASE_SHA}^{commit}"
        git cat-file -e "${HEAD_SHA}^{commit}"
        # This is a transport guard, not a reviewable-input limit. Any captured
        # diff at this ceiling is rejected by the CLI scope preflight before a
        # model call; it is never silently reviewed as a partial diff.
        set +o pipefail
        # Five lines of context retain local review evidence while keeping a
        # wide documentation/configuration PR inside the reviewer input cap.
        #
        # Lockfiles are excluded, not truncated. They are generated artefacts -
        # nobody reviews 1 700 dependency entries for risk, and the verify gate
        # installs from the same file - but a dependency PR carries a whole
        # regenerated lockfile in its diff, which on its own exceeded the
        # reviewer input cap and turned every such PR into INPUT_TOO_LARGE.
        # Excluding them before the size ceiling also keeps that ceiling honest:
        # what it cuts is reviewable code, not a hash list.
        git diff --no-ext-diff --unified=5 "${BASE_SHA}...${HEAD_SHA}" \
          -- . \
          ':(exclude)package-lock.json' \
          ':(exclude)*/package-lock.json' \
          ':(exclude)npm-shrinkwrap.json' \
          ':(exclude)*/npm-shrinkwrap.json' \
          ':(exclude)yarn.lock' \
          ':(exclude)*/yarn.lock' \
          ':(exclude)pnpm-lock.yaml' \
          ':(exclude)*/pnpm-lock.yaml' \
          | head -c 200001 > "${RUNNER_TEMP}/ai-review.diff"
        diff_exit="${PIPESTATUS[0]}"
        set -o pipefail
        if [[ "${diff_exit}" -ne 0 && "${diff_exit}" -ne 141 ]]; then
          echo "git diff failed with exit ${diff_exit}"
          exit 2
        fi
        if [[ ! -s "${RUNNER_TEMP}/ai-review.diff" ]]; then
          # Only lockfiles changed. The reviewer rejects an empty diff, but this
          # is not an infrastructure error, so give the gate something to report
          # instead of failing the run with an operator-facing error.
          printf '%s\n' \
            'This pull request changes dependency lockfiles only.' \
            'Lockfiles are generated artefacts and are excluded from review.' \
            'The dependency verification gate installs from them.' \
            > "${RUNNER_TEMP}/ai-review.diff"
        fi

    - id: review
      name: Run one-call reviewer
      shell: bash
      working-directory: packages/code-reviewer
      env:
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        AI_REVIEW_MODEL: ${{ inputs.model }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
      run: |
        set +e
        npm run review -- \
          --diff-file "${RUNNER_TEMP}/ai-review.diff" \
          --output "${RUNNER_TEMP}/ai-review.json" \
          --markdown-output "${RUNNER_TEMP}/ai-review-comment.md"
        review_exit_code=$?
        set -e

        case "${review_exit_code}" in
          0) verdict="pass" ;;
          1) verdict="fail" ;;
          *) review_exit_code=2; verdict="error" ;;
        esac

        echo "exit-code=${review_exit_code}" >> "${GITHUB_OUTPUT}"
        echo "verdict=${verdict}" >> "${GITHUB_OUTPUT}"
        echo "result-path=${RUNNER_TEMP}/ai-review.json" >> "${GITHUB_OUTPUT}"
        echo "comment-path=${RUNNER_TEMP}/ai-review-comment.md" >> "${GITHUB_OUTPUT}"
